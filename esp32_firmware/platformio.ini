; PlatformIO Project Configuration
;
; ESP32 DMX Controller
; Receives DMX data via USB Serial and outputs via MAX485

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    someweisguy/esp_dmx@^4.1.0

; Serial monitor filters
monitor_filters = esp32_exception_decoder
